<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سنتر التفوق التعليمي - لوحة الإدارة</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0; --border-soft:#eef1f6;
    --indigo:#4f46e5; --indigo-dark:#4338ca; --indigo-bg:#eef2ff;
    --emerald:#10b981; --emerald-dark:#059669; --emerald-bg:#ecfdf5;
    --red:#ef4444; --red-bg:#fef2f2; --text:#0f172a; --muted:#64748b;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04); --shadow-md:0 4px 10px rgba(15,23,42,.06);
    --radius-lg:20px; --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg);font-family:'Cairo',sans-serif;color:var(--text);margin:0;padding:20px;direction:rtl;}
  .container{max-width:900px;margin:0 auto;}
  .card{background:var(--card);border-radius:var(--radius-lg);border:1px solid var(--border-soft);box-shadow:var(--shadow-md);padding:25px;margin-bottom:20px;}
  h2{margin-top:0;font-size:20px;font-weight:800;color:var(--indigo-dark);margin-bottom:15px;}
  .form-group{margin-bottom:15px;}
  label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:6px;}
  input, select{width:100%;padding:12px;border:1px solid var(--border);border-radius:var(--radius-sm);font-family:'Cairo',sans-serif;font-size:14px;outline:none;background:#fff;}
  input:focus, select:focus{border-color:var(--indigo);box-shadow:0 0 0 3px var(--indigo-bg);}
  .btn{background:var(--indigo);color:#fff;border:none;padding:12px 20px;border-radius:var(--radius-sm);font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;width:100%;font-size:15px;transition:background 0.2s;}
  .btn:hover{background:var(--indigo-dark);}
  .connection-status{display:inline-block;padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700;margin-bottom:15px;}
  .connected{background:var(--emerald-bg);color:var(--emerald-dark);}
  .disconnected{background:var(--red-bg);color:var(--red);}
  table{width:100%;border-collapse:collapse;margin-top:10px;}
  th,td{padding:12px;text-align:right;border-bottom:1px solid var(--border-soft);font-size:14px;}
  th{font-weight:700;color:var(--muted);background:#f8fafc;}
  .actions-cell button{padding:6px 12px;border-radius:6px;border:none;cursor:pointer;font-weight:700;font-family:'Cairo',sans-serif;font-size:12px;margin-left:5px;}
  .btn-edit{background:var(--indigo-bg);color:var(--indigo-dark);}
  .btn-delete{background:var(--red-bg);color:var(--red);}
  .btn-qr{background:var(--emerald-bg);color:var(--emerald-dark);}
  
  /* Modal QR */
  .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;z-index:1000;}
  .modal-content{background:#fff;padding:30px;border-radius:var(--radius-lg);text-align:center;max-width:350px;width:100%;}
</style>
</head>
<body>

<div class="container">
  <div style="text-align:center; margin-bottom:20px;">
    <h1>سنتر التفوق التعليمي</h1>
    <div id="connStatus" class="connection-status disconnected">جاري الاتصال بقاعدة البيانات...</div>
  </div>

  <div class="card">
    <h2 id="formTitle">إضافة طالب جديد</h2>
    <form id="studentForm">
      <div class="form-group">
        <label>كود الطالب (الرقم التعريفي)</label>
        <input type="text" id="studentCode" required placeholder="مثال: 101">
      </div>
      <div class="form-group">
        <label>اسم الطالب الكامل</label>
        <input type="text" id="studentName" required placeholder="أدخل اسم الطالب">
      </div>
      <div class="form-group">
        <label>المرحلة الدراسية</label>
        <input type="text" id="studentGrade" required placeholder="مثال: الصف الأول الثانوي">
      </div>
      <div class="form-group">
        <label>حالة المصاريف</label>
        <select id="feesPaid">
          <option value="true">تم السداد ✓</option>
          <option value="false">لم يسدد ✗</option>
        </select>
      </div>
      <div class="form-group">
        <label>الحصص المحضورة</label>
        <input type="number" id="attendedSessions" value="0">
      </div>
      <div class="form-group">
        <label>إجمالي الحصص</label>
        <input type="number" id="totalSessions" value="8">
      </div>
      <div class="form-group">
        <label>درجة آخر امتحان (من 100)</label>
        <input type="number" id="examGrade" value="0">
      </div>
      <button type="submit" class="btn" id="saveBtn">حفظ البيانات</button>
    </form>
  </div>

  <div class="card">
    <h2>قائمة الطلاب المسجلين</h2>
    <div style="overflow-x:auto;">
      <table>
        <thead>
          <tr>
            <th>الكود</th>
            <th>الاسم</th>
            <th>المرحلة</th>
            <th>المصاريف</th>
            <th>الإجراءات</th>
          </tr>
        </thead>
        <tbody id="studentsTableBody">
          <tr><td colspan="5" style="text-align:center; color:var(--muted);">جاري تحميل الطلاب...</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<!-- Modal QR Code -->
<div class="modal" id="qrModal">
  <div class="modal-content">
    <h3 id="qrStudentName" style="margin-top:0;">كارنيه الطالب</h3>
    <div id="qrcode" style="display:flex; justify-content:center; margin:20px 0;"></div>
    <button class="btn" onclick="closeQrModal()">إغلاق</button>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyD6UDuCBns0_zdWOhnLOX3OtKelHs3hGmc",
  authDomain: "altafawuk-center.firebaseapp.com",
  databaseURL: "https://altafawuk-center-default-rtdb.firebaseio.com",
  projectId: "altafawuk-center",
  storageBucket: "altafawuk-center.firebasestorage.app",
  messagingSenderId: "499180495752",
  appId: "1:499180495752:web:b48e6d3b2d0a7f6cc103d",
  measurementId: "G-69RJ1X96WM"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// فحص الاتصال
const statusEl = document.getElementById('connStatus');
db.ref('.info/connected').on('value', snap => {
  if (snap.val() === true) {
    statusEl.textContent = "متصل بقاعدة البيانات بنجاح ✓";
    statusEl.className = "connection-status connected";
  } else {
    statusEl.textContent = "غير متصل، جاري إعادة المحاولة...";
    statusEl.className = "connection-status disconnected";
  }
});

// حفظ أو تعديل الطالب
document.getElementById('studentForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const code = document.getElementById('studentCode').value.trim();
  const data = {
    name: document.getElementById('studentName').value.trim(),
    gradeLevel: document.getElementById('studentGrade').value.trim(),
    feesPaid: document.getElementById('feesPaid').value === 'true',
    attendedSessions: Number(document.getElementById('attendedSessions').value),
    totalSessions: Number(document.getElementById('totalSessions').value),
    examGrade: Number(document.getElementById('examGrade').value)
  };

  db.ref('students/' + code).set(data).then(() => {
    alert('تم حفظ بيانات الطالب بنجاح!');
    document.getElementById('studentForm').reset();
    document.getElementById('studentCode').disabled = false;
    document.getElementById('formTitle').textContent = 'إضافة طالب جديد';
  }).catch(err => {
    alert('حدث خطأ أثناء الحفظ: ' + err.message);
  });
});

// جلب وعرض الطلاب
db.ref('students').on('value', snap => {
  const tbody = document.getElementById('studentsTableBody');
  tbody.innerHTML = '';
  if (!snap.exists()) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:var(--muted);">لا يوجد طلاب مسجلين حتى الآن.</td></tr>';
    return;
  }
  
  snap.forEach(childSnap => {
    const code = childSnap.key;
    const s = childSnap.val();
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${code}</td>
      <td><b>${s.name || ''}</b></td>
      <td>${s.gradeLevel || ''}</td>
      <td><span style="color:${s.feesPaid?'var(--emerald-dark)':'var(--red)'}; font-weight:700;">${s.feesPaid?'تم السداد':'لم يسدد'}</span></td>
      <td class="actions-cell">
        <button class="btn-edit" onclick="editStudent('${code}')">تعديل</button>
        <button class="btn-qr" onclick="showQr('${code}', '${s.name || ''}')">الـ QR</button>
        <button class="btn-delete" onclick="deleteStudent('${code}')">حذف</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
});

function editStudent(code) {
  db.ref('students/' + code).once('value').then(snap => {
    if (!snap.exists()) return;
    const s = snap.val();
    document.getElementById('studentCode').value = code;
    document.getElementById('studentCode').disabled = true; // منع تغيير الكود أثناء التعديل
    document.getElementById('studentName').value = s.name || '';
    document.getElementById('studentGrade').value = s.gradeLevel || '';
    document.getElementById('feesPaid').value = s.feesPaid ? 'true' : 'false';
    document.getElementById('attendedSessions').value = s.attendedSessions || 0;
    document.getElementById('totalSessions').value = s.totalSessions || 8;
    document.getElementById('examGrade').value = s.examGrade || 0;
    
    document.getElementById('formTitle').textContent = 'تعديل بيانات الطالب: ' + code;
    window.scrollTo({top:0, behavior:'smooth'});
  });
}

function deleteStudent(code) {
  if (confirm('هل أنت متأكد من حذف هذا الطالب؟')) {
    db.ref('students/' + code).remove();
  }
}

// عرض الـ QR Code
let qrcodeInstance = null;
function showQr(code, name) {
  document.getElementById('qrStudentName').textContent = name;
  const qrContainer = document.getElementById('qrcode');
  qrContainer.innerHTML = '';
  
  // توليد الرابط بناءً على رابط موقعك الحالي على جيت هب
  const currentDomain = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);
  const studentUrl = currentDomain + 'student.html?code=' + code;
  
  qrcodeInstance = new QRCode(qrContainer, {
    text: studentUrl,
    width: 200,
    height: 200
  });
  
  document.getElementById('qrModal').style.display = 'flex';
}

function closeQrModal() {
  document.getElementById('qrModal').style.display = 'none';
}
</script>
</body>
</html>
